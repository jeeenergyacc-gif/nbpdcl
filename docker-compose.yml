version: "3.9"

services:
  backend:
    build: ./backend
    container_name: nbpdcl-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_SCRIPT_URL=${GOOGLE_SCRIPT_URL:-https://script.google.com/macros/s/AKfycbxO77du2CUfSNtRBOunzq1xPHCR5zrj2uNtW0jRLIN5u8gr1i8NCh4Gedo-qesK8Nuw/exec}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - DEMO_USERNAME=${DEMO_USERNAME:-admin}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-nbpdcl@2026}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nbpdcl-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
